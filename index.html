<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Delta Wave – طلب الانضمام</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04070d;--card:#0b1630;--line:#1b3a66;--tx:#eaf2fb;--mut:#9db4cf;--ac:#2aa4ff;--err:#ff6b7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#04070d}}
:root[data-theme="dark"]{--bg:#04070d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo','Segoe UI',Tahoma,sans-serif;min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%;position:relative;overflow-x:hidden}
.wm{position:fixed;top:0;right:0;bottom:0;left:0;background:center 62%/min(120%,900px) no-repeat;opacity:.13;pointer-events:none}
main{position:relative;max-width:640px;margin:0 auto;padding:20px 18px 48px}
.logo{display:block;margin:0 auto 4px;width:min(300px,70%);height:auto;border-radius:12px}
h1{font-size:28px;font-weight:800;text-align:center;margin:8px 0 2px}
.sub{text-align:center;color:var(--mut);font-size:16px;margin:0 0 20px}
.sub b{color:var(--ac)}
form,.done{background:rgba(11,22,48,.88);border:1px solid var(--line);border-radius:20px;padding:22px 18px;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
label{display:block;font-weight:600;font-size:16px;margin:16px 0 6px}
label small{color:var(--mut);font-weight:400;font-size:13px;margin-inline-start:6px}
input,textarea,button{-webkit-appearance:none;appearance:none}
input,textarea{width:100%;border-radius:12px;font:inherit;font-size:16px;color:var(--tx);background:#071022;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(42,164,255,.2)}
textarea{min-height:96px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:480px){.row{grid-template-columns:1fr}}
.err{color:var(--err);font-size:13px;min-height:16px;margin-top:4px}
.bad{border-color:var(--err)}
button,.btn{display:block;width:100%;margin-top:22px;font:inherit;font-weight:800;font-size:18px;color:#04101f;background:linear-gradient(90deg,#2aa4ff,#1e6fe0);border:0;border-radius:14px;padding:14px;cursor:pointer;text-align:center;text-decoration:none}
button:active,.btn:active{transform:scale(.98)}
.done{display:none;text-align:center}
.done h2{margin:0 0 6px;font-size:24px}
.done p{color:var(--mut);margin:6px 0}
.ghost{background:transparent;color:var(--ac);border:1.5px solid var(--ac);margin-top:12px;font-size:16px}
.foot{text-align:center;color:var(--mut);font-size:14px;margin-top:18px}
</style></head><body>
